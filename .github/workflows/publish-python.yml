# Publish the Python SDK to PyPI.
#
# Runs on a tag, and only after the tests have passed in the same job — a
# release that skips the suite is how a broken version reaches people who
# cannot unsee it, since PyPI does not allow re-uploading a version.
#
# No API token. This uses PyPI's trusted publishing: the repository and
# workflow are named on the PyPI side, and GitHub proves the run's identity
# with a short-lived OIDC token. Nothing long-lived exists to leak, and
# nobody has to keep a secret in the repository settings.
name: Publish Python

on:
  push:
    tags: ["python-v*"]
  # So a release can be made from the Actions tab without pushing a tag.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for trusted publishing. Nothing else is granted.
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The floor as well as the current version, because pyproject claims
      # >=3.9 and a claim nothing checks stops being true.
      - run: pip install pytest build
      - run: python -m pytest -q

      - run: python -m build

      # Shows what is about to go out, in the log, before it goes.
      - run: ls -l dist

      # PEP 561: the marker has to be INSIDE the wheel, and whether it gets
      # there depends on build config that no test exercises. 0.2.1 shipped
      # without it and nothing noticed, because a missing marker does not
      # fail anything -- it just makes every annotation invisible to a type
      # checker in somebody else's project. PyPI does not allow replacing a
      # version, so this has to fail before the upload, not after.
      - name: The wheel must carry py.typed
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              sys.exit("no wheel was built")
          for w in wheels:
              names = zipfile.ZipFile(w).namelist()
              if "secure_ai/py.typed" not in names:
                  print("contents of", w)
                  for n in names:
                      print("   ", n)
                  sys.exit(w + " has no secure_ai/py.typed")
              print(w, ": py.typed present")
          PY

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
